<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Exercise Data - GymMetrics</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        /* Header (same as dashboard) */
        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #090979);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Main Content */
        .main-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-title {
            text-align: center;
            margin-bottom: 2rem;
        }

        .page-title h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff, #b3b3b3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-title p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Upload Form */
        .upload-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 2rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.75rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
        }

        .form-select, .form-input {
            width: 100%;
            padding: 1rem 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-select:focus, .form-input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
            background: rgba(255, 255, 255, 0.15);
        }

        .form-select option {
            background: #1a1a2e;
            color: white;
        }

        /* File Upload Area */
        .file-upload-area {
            position: relative;
            margin-bottom: 2rem;
        }

        .file-upload {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            padding: 3rem 2rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.05);
        }

        .file-upload:hover {
            border-color: #007bff;
            background: rgba(0, 123, 255, 0.1);
            transform: translateY(-2px);
        }

        .file-upload.dragover {
            border-color: #28a745;
            background: rgba(40, 167, 69, 0.1);
            transform: scale(1.02);
        }

        .file-upload-icon {
            font-size: 3rem;
            color: #007bff;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .file-upload:hover .file-upload-icon {
            transform: scale(1.1);
            color: #0056b3;
        }

        .file-upload-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .file-upload-hint {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .file-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-selected {
            background: rgba(40, 167, 69, 0.1);
            border-color: #28a745;
        }

        .file-info {
            display: none;
            background: rgba(40, 167, 69, 0.1);
            border: 1px solid rgba(40, 167, 69, 0.3);
            border-radius: 12px;
            padding: 1rem;
            margin-top: 1rem;
            text-align: left;
        }

        .file-info.show {
            display: block;
        }

        .file-name {
            font-weight: 600;
            color: #28a745;
            margin-bottom: 0.5rem;
        }

        .file-size {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Submit Button */
        .btn-submit {
            background: linear-gradient(135deg, #28a745, #1e7e34);
            color: white;
            padding: 1.25rem 2rem;
            font-size: 1.1rem;
            width: 100%;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Back Button */
        .back-button {
            background: rgba(108, 117, 125, 0.2);
            color: #6c757d;
            border: 1px solid rgba(108, 117, 125, 0.3);
            margin-bottom: 2rem;
        }

        .back-button:hover {
            background: rgba(108, 117, 125, 0.3);
            color: white;
        }

        /* Progress Bar */
        .progress-container {
            display: none;
            margin-top: 1rem;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #007bff, #0056b3);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Exercise Type Icons */
        .exercise-option {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 0;
        }

        .exercise-icon {
            width: 24px;
            text-align: center;
            color: #007bff;
        }

        /* Alert Messages */
        .alert {
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            font-weight: 500;
            border: 1px solid;
        }

        .alert-success {
            background: rgba(40, 167, 69, 0.2);
            color: #28a745;
            border-color: rgba(40, 167, 69, 0.3);
        }

        .alert-error {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            border-color: rgba(220, 53, 69, 0.3);
        }

        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav {
                flex-direction: column;
                gap: 1rem;
            }

            .main-content {
                padding: 1rem;
            }

            .page-title h1 {
                font-size: 2rem;
            }

            .upload-card {
                padding: 1.5rem;
            }

            .file-upload {
                padding: 2rem 1rem;
            }

            .file-upload-icon {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="nav">
            <div class="logo">
                <i class="fas fa-dumbbell"></i>
                <span>GymMetrics</span>
            </div>
            <div class="nav-actions">
                <a href="#dashboard" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i>
                    Back to Dashboard
                </a>
                <a href="#logout" class="btn btn-secondary">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </a>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Page Title -->
        <div class="page-title">
            <h1>Upload Exercise Data</h1>
            <p>Upload your accelerometer data to analyze your workout form</p>
        </div>

        <!-- Alert Messages -->
        <div id="alertContainer"></div>

        <!-- Upload Form -->
        <div class="upload-card">
            <form id="uploadForm" enctype="multipart/form-data">
                <!-- Exercise Type Selection -->
                <div class="form-group">
                    <label for="exerciseType" class="form-label">
                        <i class="fas fa-dumbbell" style="margin-right: 0.5rem;"></i>
                        Select Exercise Type
                    </label>
                    <select id="exerciseType" name="exercise_type" class="form-select" required>
                        <option value="">Choose an exercise...</option>
                        <option value="Lateral raises" class="exercise-option">
                            <span class="exercise-icon"><i class="fas fa-arrows-alt-h"></i></span>
                            Lateral Raises
                        </option>
                        <option value="Single arm extensions">Single Arm Extensions</option>
                        <option value="Bicep curls">Bicep Curls</option>
                        <option value="Hammer curls">Hammer Curls</option>
                        <option value="Single arm tricep extensions">Single Arm Tricep Extensions</option>
                    </select>
                </div>

                <!-- Exercise Date -->
                <div class="form-group">
                    <label for="exerciseDate" class="form-label">
                        <i class="fas fa-calendar-alt" style="margin-right: 0.5rem;"></i>
                        Exercise Date
                    </label>
                    <input type="date" id="exerciseDate" name="exercise_date" class="form-input" required>
                </div>

                <!-- File Upload Area -->
                <div class="file-upload-area">
                    <label for="csvFile" class="form-label">
                        <i class="fas fa-file-csv" style="margin-right: 0.5rem;"></i>
                        Upload CSV File
                    </label>
                    <div class="file-upload" id="fileUpload">
                        <div class="file-upload-icon">
                            <i class="fas fa-cloud-upload-alt"></i>
                        </div>
                        <div class="file-upload-text">
                            Click to upload or drag and drop
                        </div>
                        <div class="file-upload-hint">
                            CSV files only (Max size: 10MB)
                        </div>
                        <input type="file" id="csvFile" name="file" class="file-input" accept=".csv" required>
                    </div>
                    
                    <!-- File Info -->
                    <div class="file-info" id="fileInfo">
                        <div class="file-name" id="fileName"></div>
                        <div class="file-size" id="fileSize"></div>
                    </div>
                </div>

                <!-- Progress Bar -->
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text" id="progressText">Uploading...</div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-upload" style="margin-right: 0.5rem;"></i>
                    Upload Exercise Data
                </button>
            </form>
        </div>
    </main>

    <script>
        // Set today's date as default
        document.getElementById('exerciseDate').valueAsDate = new Date();

        // File upload handling
        const fileUpload = document.getElementById('fileUpload');
        const fileInput = document.getElementById('csvFile');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const submitBtn = document.getElementById('submitBtn');
        const uploadForm = document.getElementById('uploadForm');
        const alertContainer = document.getElementById('alertContainer');

        // Drag and drop functionality
        fileUpload.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileUpload.classList.add('dragover');
        });

        fileUpload.addEventListener('dragleave', () => {
            fileUpload.classList.remove('dragover');
        });

        fileUpload.addEventListener('drop', (e) => {
            e.preventDefault();
            fileUpload.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        // Handle file selection
        function handleFileSelect(file) {
            if (!file.name.toLowerCase().endsWith('.csv')) {
                showAlert('Please select a valid CSV file.', 'error');
                return;
            }

            if (file.size > 10 * 1024 * 1024) { // 10MB limit
                showAlert('File size exceeds 10MB limit.', 'error');
                return;
            }

            // Update UI
            fileUpload.classList.add('file-selected');
            fileName.textContent = file.name;
            fileSize.textContent = `Size: ${(file.size / 1024).toFixed(1)} KB`;
            fileInfo.classList.add('show');
            
            // Update upload area text
            fileUpload.querySelector('.file-upload-text').textContent = 'File selected successfully';
            fileUpload.querySelector('.file-upload-hint').textContent = 'Click to select a different file';
            fileUpload.querySelector('.file-upload-icon i').className = 'fas fa-check-circle';
        }

        // Form submission
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(uploadForm);
            
            // Validate form
            if (!formData.get('exercise_type') || !formData.get('exercise_date') || !formData.get('file')) {
                showAlert('Please fill in all required fields.', 'error');
                return;
            }

            // Show loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="loading"></div> Processing...';
            
            // Show progress bar
            const progressContainer = document.getElementById('progressContainer');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            
            progressContainer.style.display = 'block';
            
            // Simulate upload progress
            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress > 90) progress = 90;
                progressFill.style.width = progress + '%';
                progressText.textContent = `Processing... ${Math.round(progress)}%`;
            }, 200);

            try {
                // Simulate API call (replace with actual endpoint)
                await new Promise(resolve => setTimeout(resolve, 3000));
                
                // Complete progress
                clearInterval(progressInterval);
                progressFill.style.width = '100%';
                progressText.textContent = 'Upload complete!';
                
                // Show success message
                showAlert('Exercise data uploaded successfully! Redirecting to dashboard...', 'success');
                
                // Reset form
                setTimeout(() => {
                    window.location.href = '#dashboard'; // Replace with actual dashboard URL
                }, 2000);
                
            } catch (error) {
                clearInterval(progressInterval);
                progressContainer.style.display = 'none';
                showAlert('Upload failed. Please try again.', 'error');
                
                // Reset button
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-upload" style="margin-right: 0.5rem;"></i>Upload Exercise Data';
            }
        });

        // Show alert messages
        function showAlert(message, type) {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = `
                <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}" style="margin-right: 0.5rem;"></i>
                ${message}
            `;
            
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alert);
            
            // Auto hide after 5 seconds
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        // Exercise type icons mapping
        const exerciseIcons = {
            'Lateral raises': 'fas fa-arrows-alt-h',
            'Single arm extensions': 'fas fa-long-arrow-alt-right',
            'Bicep curls': 'fas fa-dumbbell',
            'Hammer curls': 'fas fa-hammer',
            'Single arm tricep extensions': 'fas fa-angle-down'
        };

        // Update form validation feedback
        const inputs = document.querySelectorAll('.form-input, .form-select');
        inputs.forEach(input => {
            input.addEventListener('blur', () => {
                if (input.value.trim() === '' && input.hasAttribute('required')) {
                    input.style.borderColor = '#dc3545';
                } else {
                    input.style.borderColor = 'rgba(255, 255, 255, 0.2)';
                }
            });
        });
    </script>
</body>
</html>
