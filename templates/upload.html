{% extends 'base.html' %}

{% block title %}
Upload Exercise Data - GymMetrics
{% endblock %}

{% block head %}
<style>
  .upload-card {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 3rem;
    margin-bottom: 2rem;
    box-shadow: var(--shadow-soft);
    position: relative;
    overflow: hidden;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
    margin-bottom: 2rem;
  }

  .form-group {
    margin-bottom: 2rem;
  }

  .form-label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
    font-weight: 600;
    color: var(--text-secondary);
    font-size: 1rem;
  }

  .form-select, .form-input {
    width: 100%;
    padding: 1.25rem 1.5rem;
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.05);
    color: white;
    font-size: 1rem;
    transition: all 0.3s ease;
  }

  .file-upload-area {
    margin-bottom: 2rem;
  }

  .file-upload {
    border: 2px dashed rgba(255, 255, 255, 0.3);
    border-radius: 20px;
    padding: 4rem 2rem;
    text-align: center;
    transition: all 0.3s ease;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.02);
  }

  .btn-submit {
    background: var(--success-gradient);
    color: white;
    padding: 1.5rem 2.5rem;
    font-size: 1.2rem;
    width: 100%;
    border: none;
    border-radius: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
  }
</style>
{% endblock %}

{% block content %}
<div class="upload-card">
  <form method="POST" enctype="multipart/form-data">
    <div class="form-group">
      <label for="exercise_type" class="form-label">Exercise Type</label>
      <select name="exercise_type" id="exercise_type" class="form-select">
        <option value="Bicep curls">Bicep curls</option>
        <option value="Hammer curls">Hammer curls</option>
        <option value="Lateral raises">Lateral raises</option>
        <option value="Sidearm extensions">Sidearm extensions</option>
        <option value="Single arm tricep extensions">Single arm tricep extensions</option>
      </select>
    </div>

    <div class="form-group">
      <label for="exercise_date" class="form-label">Exercise Date</label>
      <input type="date" id="exercise_date" name="exercise_date" class="form-input" required>
    </div>

    <div class="file-upload-area">
      <label for="file" class="form-label">Upload Accelerometer Data (CSV)</label>
      <div class="file-upload" id="fileUpload">
        <input type="file" id="file" name="file" class="form-input" required>
      </div>
    </div>

    <button type="submit" class="btn-submit">Analyze Exercise Data</button>
  </form>
</div>
{% endblock %}
