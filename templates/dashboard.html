<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymMetrics - Exercise Tracking Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.1;
        }

        .bg-shape {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(45deg, #00d4ff, #090979);
            animation: float 20s infinite ease-in-out;
        }

        .bg-shape:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .bg-shape:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 60%;
            left: 80%;
            animation-delay: -5s;
        }

        .bg-shape:nth-child(3) {
            width: 100px;
            height: 100px;
            top: 80%;
            left: 20%;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-30px) rotate(120deg); }
            66% { transform: translateY(20px) rotate(240deg); }
        }

        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #090979);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 123, 255, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Main Content */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-title {
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-title h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff, #b3b3b3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-title p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        /* Exercise Cards */
        .exercise-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .exercise-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #00d4ff, #090979);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .exercise-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .exercise-card:hover::before {
            opacity: 1;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .exercise-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #007bff, #0056b3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }

        .exercise-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
            margin-bottom: 0.5rem;
        }

        .exercise-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #00d4ff;
            display: block;
        }

        .stat-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .progress-ring {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .progress-ring-circle {
            transition: stroke-dashoffset 0.5s ease-in-out;
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.9rem;
            font-weight: 600;
            color: white;
        }

        /* Status Badges */
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-active {
            background: rgba(40, 167, 69, 0.2);
            color: #28a745;
            border: 1px solid rgba(40, 167, 69, 0.3);
        }

        .status-inactive {
            background: rgba(108, 117, 125, 0.2);
            color: #6c757d;
            border: 1px solid rgba(108, 117, 125, 0.3);
        }

        /* Action Buttons */
        .card-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn-view {
            flex: 1;
            background: linear-gradient(135deg, #28a745, #1e7e34);
            color: white;
            justify-content: center;
        }

        .btn-view:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.3);
        }

        .btn-upload {
            background: linear-gradient(135deg, #ffc107, #e0a800);
            color: #212529;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            margin: 2rem auto;
            display: block;
            width: fit-content;
        }

        .btn-upload:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 193, 7, 0.4);
        }

        /* Login Form Styles */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }

        .form-input {
            width: 100%;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
            background: rgba(255, 255, 255, 0.15);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* Upload Form */
        .upload-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .file-upload {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .file-upload:hover {
            border-color: #007bff;
            background: rgba(0, 123, 255, 0.1);
        }

        .file-upload.dragover {
            border-color: #28a745;
            background: rgba(40, 167, 69, 0.1);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav {
                flex-direction: column;
                gap: 1rem;
            }

            .nav-actions {
                flex-wrap: wrap;
                justify-content: center;
            }

            .main-content {
                padding: 1rem;
            }

            .page-title h1 {
                font-size: 2rem;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .exercise-card {
                padding: 1.5rem;
            }
        }

        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #007bff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Success/Error Messages */
        .alert {
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .alert-success {
            background: rgba(40, 167, 69, 0.2);
            color: #28a745;
            border: 1px solid rgba(40, 167, 69, 0.3);
        }

        .alert-error {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="bg-shape"></div>
        <div class="bg-shape"></div>
        <div class="bg-shape"></div>
    </div>

    <!-- Header -->
    <header class="header">
        <nav class="nav">
            <div class="logo">
                <i class="fas fa-dumbbell"></i>
                <span>GymMetrics</span>
            </div>
            <div class="nav-actions">
                <a href="#upload" class="btn btn-primary">
                    <i class="fas fa-upload"></i>
                    Upload Data
                </a>
                <a href="#logout" class="btn btn-secondary">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </a>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Page Title -->
        <div class="page-title">
            <h1>Your Exercise Tracking</h1>
            <p>Track your workout progress with precision using AI-powered form analysis</p>
        </div>

        <!-- Dashboard Grid -->
        <div class="dashboard-grid" id="exerciseGrid">
            <!-- Exercise cards will be generated here -->
        </div>

        <!-- Upload Button -->
        <a href="#upload" class="btn btn-upload">
            <i class="fas fa-plus"></i>
            Upload New Data
        </a>
    </main>

    <!-- Sample Data for Demo -->
    <script>
        // Sample exercise data
        const exerciseData = [
            {
                name: 'Lateral Raises',
                icon: 'fas fa-arrows-alt-h',
                sessions: 5,
                avgAccuracy: 85,
                lastAccuracy: 92,
                trend: 'up',
                hasData: true
            },
            {
                name: 'Single Arm Extensions',
                icon: 'fas fa-long-arrow-alt-right',
                sessions: 0,
                avgAccuracy: 0,
                lastAccuracy: 0,
                trend: 'neutral',
                hasData: false
            },
            {
                name: 'Bicep Curls',
                icon: 'fas fa-dumbbell',
                sessions: 0,
                avgAccuracy: 0,
                lastAccuracy: 0,
                trend: 'neutral',
                hasData: false
            },
            {
                name: 'Hammer Curls',
                icon: 'fas fa-hammer',
                sessions: 0,
                avgAccuracy: 0,
                lastAccuracy: 0,
                trend: 'neutral',
                hasData: false
            },
            {
                name: 'Single Arm Tricep Extensions',
                icon: 'fas fa-angle-down',
                sessions: 0,
                avgAccuracy: 0,
                lastAccuracy: 0,
                trend: 'neutral',
                hasData: false
            }
        ];

        // Generate progress ring SVG
        function createProgressRing(percentage, size = 80) {
            const radius = 30;
            const circumference = 2 * Math.PI * radius;
            const offset = circumference - (percentage / 100) * circumference;
            
            return `
                <svg class="progress-ring" width="${size}" height="${size}">
                    <circle
                        cx="${size/2}"
                        cy="${size/2}"
                        r="${radius}"
                        fill="transparent"
                        stroke="rgba(255, 255, 255, 0.1)"
                        stroke-width="4"
                    />
                    <circle
                        class="progress-ring-circle"
                        cx="${size/2}"
                        cy="${size/2}"
                        r="${radius}"
                        fill="transparent"
                        stroke="#00d4ff"
                        stroke-width="4"
                        stroke-dasharray="${circumference}"
                        stroke-dashoffset="${offset}"
                        stroke-linecap="round"
                        transform="rotate(-90 ${size/2} ${size/2})"
                    />
                </svg>
                <div class="progress-text">${percentage}%</div>
            `;
        }

        // Generate exercise cards
        function generateExerciseCards() {
            const grid = document.getElementById('exerciseGrid');
            
            exerciseData.forEach((exercise, index) => {
                const card = document.createElement('div');
                card.className = 'exercise-card';
                card.style.animationDelay = `${index * 0.1}s`;
                
                const trendIcon = exercise.trend === 'up' ? 'fa-arrow-up' : 
                                exercise.trend === 'down' ? 'fa-arrow-down' : 'fa-minus';
                const trendColor = exercise.trend === 'up' ? '#28a745' : 
                                 exercise.trend === 'down' ? '#dc3545' : '#6c757d';
                
                card.innerHTML = `
                    <div class="exercise-header">
                        <div class="exercise-icon">
                            <i class="${exercise.icon}"></i>
                        </div>
                        <span class="status-badge ${exercise.hasData ? 'status-active' : 'status-inactive'}">
                            ${exercise.hasData ? 'Active' : 'No Data'}
                        </span>
                    </div>
                    
                    <div class="exercise-title">${exercise.name}</div>
                    
                    <div class="exercise-stats">
                        <div class="stat">
                            <span class="stat-value">${exercise.sessions}</span>
                            <span class="stat-label">Sessions</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value">${exercise.avgAccuracy}%</span>
                            <span class="stat-label">Avg Accuracy</span>
                        </div>
                        <div class="stat">
                            <i class="fas ${trendIcon}" style="color: ${trendColor}; font-size: 1.2rem;"></i>
                        </div>
                    </div>
                    
                    <div style="position: relative; display: flex; justify-content: center; margin: 1rem 0;">
                        ${createProgressRing(exercise.lastAccuracy)}
                    </div>
                    
                    <div class="card-actions">
                        <button class="btn btn-view ${!exercise.hasData ? 'disabled' : ''}" 
                                ${!exercise.hasData ? 'disabled' : ''}>
                            <i class="fas fa-chart-line"></i>
                            View Analytics
                        </button>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        // Animate progress rings on load
        function animateProgressRings() {
            const rings = document.querySelectorAll('.progress-ring-circle');
            rings.forEach((ring, index) => {
                setTimeout(() => {
                    ring.style.strokeDashoffset = ring.getAttribute('stroke-dashoffset');
                }, index * 200);
            });
        }

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', () => {
            generateExerciseCards();
            setTimeout(animateProgressRings, 500);
            
            // Add smooth scrolling for navigation
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        target.scrollIntoView({
                            behavior: 'smooth',
                            block: 'start'
                        });
                    }
                });
            });
        });

        // Add loading states to buttons
        document.addEventListener('click', (e) => {
            if (e.target.matches('.btn-view:not(.disabled)')) {
                const originalText = e.target.innerHTML;
                e.target.innerHTML = '<div class="loading"></div> Loading...';
                e.target.disabled = true;
                
                setTimeout(() => {
                    e.target.innerHTML = originalText;
                    e.target.disabled = false;
                }, 2000);
            }
        });
    </script>
</body>
</html>
