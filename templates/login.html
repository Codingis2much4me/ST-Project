{% extends 'base.html' %}

{% block title %}
Login - GymMetrics
{% endblock %}

{% block head %}
<style>
  .login-card {
    width: 100%;
    max-width: 450px;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 40px;
    box-shadow: var(--shadow-soft);
    position: relative;
    overflow: hidden;
    margin: 2rem auto;
  }

  .login-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: var(--primary-gradient);
  }

  .login-header {
    text-align: center;
    margin-bottom: 30px;
  }

  .login-title {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 10px;
    background: var(--primary-gradient);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .login-subtitle {
    color: var(--text-secondary);
    font-size: 1rem;
  }

  .form-group {
    position: relative;
    margin-bottom: 25px;
  }

  .form-control {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    padding: 15px 50px 15px 20px;
    color: var(--text-primary);
    font-size: 1rem;
    transition: all 0.3s ease;
    height: 55px;
  }

  .form-control:focus {
    background: rgba(255, 255, 255, 0.15);
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
    outline: none;
    transform: translateY(-2px);
  }

  .form-control::placeholder {
    color: rgba(255, 255, 255, 0.6);
  }

  .input-icon {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255, 255, 255, 0.5);
    font-size: 1.2rem;
    transition: all 0.3s ease;
  }

  .form-control:focus + .input-icon {
    color: #667eea;
    transform: translateY(-50%) scale(1.1);
  }

  .btn-login {
    width: 100%;
    height: 55px;
    border: none;
    border-radius: 12px;
    background: var(--primary-gradient);
    color: white;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    margin-top: 10px;
  }

  .btn-login:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-glow);
    background: linear-gradient(135deg, #7c88ff 0%, #8b5fbf 100%);
  }

  .signup-section {
    text-align: center;
    margin-top: 30px;
    padding-top: 25px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }

  .signup-link {
    color: #667eea;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .signup-link:hover {
    color: #7c88ff;
    text-decoration: none;
    text-shadow: 0 0 8px rgba(102, 126, 234, 0.5);
  }
</style>
{% endblock %}

{% block content %}
<div class="login-card">
  <div class="login-header">
    <h1 class="login-title">Welcome Back</h1>
    <p class="login-subtitle">Sign in to track your fitness journey</p>
  </div>
  
  <form method="POST" action="{{ url_for('login') }}" id="loginForm">
    <div class="form-group">
      <input type="text" 
             class="form-control" 
             id="username" 
             name="username" 
             placeholder="Enter your username"
             required
             autocomplete="username">
      <i class="fas fa-user input-icon"></i>
    </div>
    
    <div class="form-group">
      <input type="password" 
             class="form-control" 
             id="password" 
             name="password" 
             placeholder="Enter your password"
             required
             autocomplete="current-password">
      <i class="fas fa-eye password-toggle input-icon" onclick="togglePassword()"></i>
    </div>
    
    <button type="submit" class="btn btn-login">
      <span class="btn-text">Sign In</span>
    </button>
  </form>
  
  <div class="signup-section">
    <p class="mb-0" style="color: rgba(255, 255, 255, 0.7);">
      New to GymMetrics? 
      <a href="{{ url_for('signup') }}" class="signup-link">Create Account</a>
    </p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  // Password toggle functionality
  function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.querySelector('.password-toggle');
      
      if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          toggleIcon.classList.remove('fa-eye');
          toggleIcon.classList.add('fa-eye-slash');
      } else {
          passwordInput.type = 'password';
          toggleIcon.classList.remove('fa-eye-slash');
          toggleIcon.classList.add('fa-eye');
      }
  }
</script>
{% endblock %}
