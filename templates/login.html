<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Exercise Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <style>
      body {
          padding-top: 80px;
          background: url("{{ url_for('static', filename='gym_pic.jpg') }}") no-repeat center center fixed;
          background-size: cover;
          color: white;
      }
      .overlay {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.5);
          z-index: 1;
      }
      .container {
          max-width: 450px;
          background: rgba(0, 0, 0, 0.8);
          padding: 25px;
          border-radius: 15px;
          box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.4);
          position: relative;
          z-index: 2;
      }
      .navbar {
          background: rgba(0, 0, 0, 0.9) !important;
          box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
          z-index: 3;
      }
      .navbar-brand {
          font-size: 2.5rem !important;
          font-weight: 700 !important;
          letter-spacing: 1px;
          color: white !important;
          background: linear-gradient(90deg, #3a86ff, #00bfff);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          padding: 5px 15px;
          border-radius: 4px;
          transition: all 0.2s ease;
          animation: fadeIn 1.5s ease-in-out;
      }
      @keyframes fadeIn {
          0% { opacity: 0; transform: translateY(-20px); }
          100% { opacity: 1; transform: translateY(0); }
      }
      .form-control {
          background-color: rgba(255, 255, 255, 0.15);
          border: 1px solid rgba(255, 255, 255, 0.3);
          color: white;
          margin-bottom: 20px;
      }
      .form-control:focus {
          background-color: rgba(255, 255, 255, 0.25);
          border-color: #3a86ff;
          box-shadow: 0 0 0 0.25rem rgba(58, 134, 255, 0.25);
          color: white;
      }
      .form-label {
          font-weight: 500;
          margin-bottom: 8px;
      }
      .form-control::placeholder {
          color: rgba(255, 255, 255, 0.6);
      }
      .btn-primary {
          background: #3a86ff;
          border: none;
          font-weight: 500;
          transition: all 0.2s ease-in-out;
      }
      .btn-primary:hover {
          background: #4a94ff;
          transform: translateY(-1px);
      }
      .alert {
          background-color: rgba(220, 53, 69, 0.8);
          color: white;
          border: none;
      }
      .signup-link {
          color: #3a86ff;
          text-decoration: none;
      }
      .signup-link:hover {
          color: #4a94ff;
          text-decoration: underline;
      }
  </style>
</head>
<body>
  <!-- Background Overlay -->
  <div class="overlay"></div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
      <div class="container">
          <a class="navbar-brand" href="#">🏋️ Exercise Dashboard</a>
      </div>
  </nav>

  <!-- Login Form -->
  <div class="container text-center mt-5 animate__animated animate__fadeIn">
      <h1 class="mb-4">Login</h1>
      
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-danger mb-3">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      
      <form method="POST" action="{{ url_for('login') }}">
          <div class="mb-3 text-start">
              <label for="username" class="form-label">Username</label>
              <input type="text" class="form-control" id="username" name="username" required>
          </div>
          
          <div class="mb-3 text-start">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" name="password" required>
          </div>
          
          <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
      
      <div class="mt-4">
          <p>Don't have an account? <a href="{{ url_for('signup') }}" class="signup-link">Sign Up</a></p>
      </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
